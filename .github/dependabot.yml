version: 2
updates:
  # Maintain npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    reviewers:
      - "gordug"
    labels:
      - "dependencies"
      - "automated-pr"
    groups:
      development-dependencies:
        patterns:
          - "@types/*"
          - "vitest"
          - "typescript"
          - "vite*"

  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "ci"
      - "dependencies"
